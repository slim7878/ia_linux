services:

  # --- Core ---

  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llamacpp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      --models-dir /models/
      --models-max 1
      --n-gpu-layers 99
      --parallel 2
      --flash-attn auto
      --ctx-size 8192
      --mmap
      --cache-type-k q8_0
      --cache-type-v q8_0
      --jinja
      --reasoning-budget 0
      --temp 0.8
      --top-p 0.95
      --top-k 40
      --min-p 0.05
      --presence-penalty 1.1
      --repeat-penalty 1.1
      --sleep-idle-seconds 30
      --no-ui
      --port 8080
      --host 0.0.0.0

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    restart: always
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      - openwebui_data:/app/backend/data
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OPENAI_API_BASE_URL: http://llamacpp:8080/v1
      OPENAI_API_KEY: none
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - llamacpp

  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    ports:
      - "127.0.0.1:8642:8642"
      - "127.0.0.1:9119:9119"
    volumes:
      - ~/.hermes:/opt/data
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_USER}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_PASSWORD}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_SECRET}
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_API_KEY}
      API_SERVER_CORS_ORIGINS: "'*'"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS}
      TELEGRAM_HOME_CHANNEL: ${TELEGRAM_HOME_CHANNEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CLICKUP_API_TOKEN: ${CLICKUP_API_TOKEN:-}
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - llamacpp

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DOCKER_API_VERSION: "1.41"
    command: --interval 86400 --cleanup

  # --- Optionnels (activer avec : docker compose --profile comfyui up -d) ---

  comfyui:
    image: ghcr.io/ai-dock/comfyui:latest-cuda
    container_name: comfyui
    profiles: [comfyui]
    restart: unless-stopped
    ports:
      - "127.0.0.1:7860:7860"
    volumes:
      - comfyui_data:/opt/ComfyUI
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest-gpu
    container_name: whisper
    profiles: [whisper]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      ASR_MODEL: base
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  openwebui_data:
  comfyui_data:
